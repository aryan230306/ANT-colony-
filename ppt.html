<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation - Ant Colony Optimization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <a href="index.html" class="btn-back">← Back to Home</a>
    
    <div class="ppt-container">
        <h1>Presentation</h1>
        <p class="subtitle">Ant Colony Optimisation</p>
        
        <div class="ppt-viewer" id="viewer-container">
            <!-- Loading Spinner -->
            <div id="pdf-loader" class="pdf-loader">
                <div class="spinner"></div>
                <p>Loading Presentation <span id="pdf-progress">0%</span></p>
            </div>

            <canvas id="pdf-render" style="display: none;"></canvas>
            
            <div class="ppt-controls" id="pdf-controls" style="display: none;">
                <button class="ppt-btn" id="prev-page">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <span class="page-info">Slide <span id="page-num"></span> of <span id="page-count"></span></span>
                <button class="ppt-btn" id="next-page">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
                <button class="ppt-btn" id="fullscreen-btn" style="margin-left: auto;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Load PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = 'ant colony optimization ppt.pdf';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        const scale = 1.5,
              canvas = document.querySelector('#pdf-render'),
              ctx = canvas.getContext('2d');

        // Render the page
        const renderPage = num => {
            pageIsRendering = true;

            // Get page
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;

                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });

                // Output current page
                document.querySelector('#page-num').textContent = num;
            });
        };

        // Check for pages rendering
        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        // Show Prev Page
        const showPrevPage = () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        };

        // Show Next Page
        const showNextPage = () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        };

        // Get Document with Progress
        const loadingTask = pdfjsLib.getDocument(url);
        
        loadingTask.onProgress = function (progress) {
            if (progress.total > 0) {
                let percent = Math.round((progress.loaded / progress.total) * 100);
                document.getElementById('pdf-progress').textContent = percent + '%';
            }
        };

        loadingTask.promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            // Hide loader and show canvas/controls
            document.getElementById('pdf-loader').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('pdf-controls').style.display = 'flex';
            
            document.querySelector('#page-count').textContent = pdfDoc.numPages;
            renderPage(pageNum);
        });

        // Button Events
        document.querySelector('#prev-page').addEventListener('click', showPrevPage);
        document.querySelector('#next-page').addEventListener('click', showNextPage);
        
        // Fullscreen
        const viewerContainer = document.querySelector('#viewer-container');
        document.querySelector('#fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                viewerContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') showNextPage();
            if (e.key === 'ArrowLeft') showPrevPage();
        });
    </script>
</body>
</html>
