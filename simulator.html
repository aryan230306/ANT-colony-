<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial 2D Ant Colony Simulation</title>
    <meta name="description" content="A true continuous spatial ACO simulation.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        document.write('<link rel="stylesheet" href="index.css?v=' + Date.now() + '">');
    </script>
</head>
<body>
    <canvas id="simCanvas"></canvas>
    
    <a href="index.html" class="floating-btn" style="top: 20px; left: 20px; text-decoration: none; width: auto; background: rgba(255, 42, 133, 0.2); border-color: rgba(255, 42, 133, 0.5);">← Back to Home</a>
    <button id="btnShowUI" class="floating-btn hidden">Show Controls (H)</button>

    <div id="uiPanel" class="glass-panel">
        <button id="btnHideUI" class="close-btn" title="Hide Controls (H)">✖</button>
        <h1>Spatial 2D ACO</h1>
        <p class="subtitle">Biological stigmergic foraging model.</p>
        
        <div class="controls">
            <div class="control-group">
                <label>Ants Active: <span id="antCountVal">0</span></label>
                <button id="btnDeploy" class="btn primary">🐜 Deploy 1 Ant</button>
            </div>

            <div class="control-group">
                <label for="evaporationRate">Evaporation %/tick: <span id="evaporationRateVal">0.1%</span></label>
                <input type="range" id="evaporationRate" min="0.001" max="0.05" value="0.001" step="0.001">
            </div>
            
            <div class="control-group">
                <label for="exploreWeight">Exploration Mix (Randomness): <span id="exploreWeightVal">20%</span></label>
                <input type="range" id="exploreWeight" min="0" max="1" value="0.2" step="0.05">
            </div>

            <div class="control-group">
                <label for="depositAmount">Deposit Strength: <span id="depositAmountVal">50</span></label>
                <input type="range" id="depositAmount" min="10" max="255" value="50" step="5">
            </div>
            
            <div class="control-group">
                <label for="antSpeed">Ant Speed: <span id="antSpeedVal">1.5</span></label>
                <input type="range" id="antSpeed" min="0.5" max="5" value="1.5" step="0.1">
            </div>

            <div class="control-group">
                <label>Click Action:</label>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <label><input type="radio" name="clickMode" value="nest" checked> Nest</label>
                    <label><input type="radio" name="clickMode" value="food"> Food</label>
                    <label><input type="radio" name="clickMode" value="obstacle"> Obstacle</label>
                </div>
            </div>

            <div class="button-group">
                <button id="btnPause" class="btn primary">Pause</button>
                <button id="btnReset" class="btn secondary">Clear Trails</button>
                <button id="btnClearObs" class="btn secondary">Clear Obstacles</button>
            </div>
        </div>
    </div>

    <script>
        const cb = Math.random().toString(36).substring(7);
        document.write('<script src="ant.js?v=' + cb + '"><\/script>');
        document.write('<script src="simulation.js?v=' + cb + '"><\/script>');
        document.write('<script src="main.js?v=' + cb + '"><\/script>');
    </script>
</body>
</html>
